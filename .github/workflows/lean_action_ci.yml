name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly backstop build (09:00 UTC) so the badge never goes >24h stale.
    # Routine ceremony pushes carry [skip ci]; rung/campaign-end pushes omit it.
    - cron: '0 9 * * *'

# Rapid ceremony bursts supersede each other: cancel the stale run, bill ~1.
concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest
    # Billing cap: with the mathlib cache a full build is ~20-40 min; anything
    # longer is a cache miss or a wedged runner — kill it before it burns hours.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          # Explicit (not auto): the 2026-07-17 run 29599988363 spent 2h11m and
          # died starved — the signature of building mathlib from source.
          use-mathlib-cache: true
      # Blueprint lint: docs↔code consistency + repo-wide axiom audit (CLAUDE.md
      # iron rule 3). Runs AFTER lean-action so the oleans it built are on disk:
      # the lint's phase-1/phase-3 `lake env lean` invocations elaborate a tiny
      # `import Salt` scratch against those cached oleans (no full rebuild), and
      # elan/lake are already on PATH from lean-action.
      - name: Blueprint lint (docs↔code + axiom audit)
        run: python3 scripts/blueprint_lint.py
      - uses: leanprover-community/docgen-action@v1
