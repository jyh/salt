name: Lean Action CI

# Council 2026-08-26 (item 6): the Lean job is gated at PR/merge for branches and
# runs per-push only on the default branch. Measured cause: this workflow takes
# 99-110 min against a ~20-min working-push cadence, so with cancel-in-progress
# the last EIGHT runs on a working branch were all *cancelled* — never a red,
# never a green, nothing alarmed for 4.5 hours. Push discipline is not the fix
# ([skip ci] on the two eligible pushes bought 109 min against a 99-110 min run,
# a coin flip), and `schedule` fires only on the default branch so it structurally
# cannot cover a working branch. One run even wore conclusion=failure with a
# CANCELLED job and zero failed steps — a cancel in a red costume, which alarms a
# human reader while carrying no information. A branch's kernel referee is the
# local saltbuild audit (CLAUDE.md), which is green on every landing; use
# workflow_dispatch below to fire a full branch run on demand at a seam.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly backstop build (09:00 UTC) so the badge never goes >24h stale.
    # Routine ceremony pushes carry [skip ci]; rung/campaign-end pushes omit it.
    - cron: '0 9 * * *'

# Rapid ceremony bursts supersede each other: cancel the stale run, bill ~1.
concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest
    # Billing cap. The 2026-07-17 diagnosis: mathlib cache engages fine, but
    # salt's own ~9k-job corpus needs ~2-2.5h cold on a 4-core runner. 240 min
    # lets a seeding run COMPLETE so the .lake/build cache below gets saved;
    # cached runs then finish in minutes. (~$1.20 per cold run at Linux rates.)
    timeout-minutes: 240

    steps:
      # Disk headroom: the corpus (~9,400 jobs) + mathlib cache (~5.7GB) +
      # docgen outgrew the runner's ~14GB free disk (2026-07-22: runs died
      # at 9,267/9,351 with "no space left on device"). Reclaim ~25-30GB of
      # preinstalled cruft before anything heavy runs.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - uses: actions/checkout@v5
      # Salt's own build cache (mathlib comes via lake exe cache get inside
      # lean-action). restore-keys lets any prior seed serve incrementally.
      - name: Restore salt build cache
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: salt-lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            salt-lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          # Explicit (not auto): the 2026-07-17 run 29599988363 spent 2h11m and
          # died starved — the signature of building mathlib from source.
          use-mathlib-cache: true
      # Blueprint lint: docs↔code consistency + repo-wide axiom audit (CLAUDE.md
      # iron rule 3). Runs AFTER lean-action so the oleans it built are on disk:
      # the lint's phase-1/phase-3 `lake env lean` invocations elaborate a tiny
      # `import Salt` scratch against those cached oleans (no full rebuild), and
      # elan/lake are already on PATH from lean-action.
      - name: Blueprint lint (docs↔code + axiom audit)
        run: python3 scripts/blueprint_lint.py
      # ⛔ REMOVED 2026-08-28: `- uses: leanprover-community/docgen-action@v1`
      #    IT WAS GREEN ONLY WHEN IT DID NOTHING. The action sees this repo's `docs/`
      #    folder, sets DOCS_EXISTS=true, and tries to build a JEKYLL site from it —
      #    but salt has no Gemfile, no _config.yml and no docs site, so the build dies
      #    with "Could not locate Gemfile or .bundle/ directory" (exit 10).
      #    ⇒ MEASURED ACROSS RUNS RATHER THAN INFERRED FROM ONE:
      #        fbad5d1a  cache MISS -> texlive/ruby/pages sub-actions RUN   -> RED
      #        fcfb3cf2  cache HIT  -> texlive, ruby/setup-ruby, upload-pages-artifact
      #                               and deployment ALL `conclusion=skipped` -> GREEN
      #      The step's GREEN means the docs cache was hit and nothing was built; its
      #      RED means it actually ran. It has never once built or deployed docs.
      #    ⇒ ***A CHECK THAT IS GREEN ONLY WHEN IT SKIPS IS NOT A CHECK*** — and the
      #      consequence was a RED CHECK OVER A GREEN KERNEL on every salt PR, the same
      #      shape as the duplicate Lean job retired at council item 19.
      #    NOT NEUTRALISED (no `continue-on-error`, no `if: false`): a step that cannot
      #    fail is decoration. If salt is to publish API docs, that is a PROJECT item —
      #    a Gemfile, a docs site and a Pages deployment on a repo that is private now
      #    and public later behind a hard gate — and it is the Captain's to open, not a
      #    red-check repair. The Pages permissions above are left untouched for it.
