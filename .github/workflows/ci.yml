# Fresh-clone build gate for `salt` (release-hygiene lane 3).
#
# What this proves: a cold checkout of `main` installs the pinned Lean
# toolchain, pulls the precompiled mathlib cache, and `lake build`s the whole
# corpus to green — the exact "clone → build" experience promised in README.md.
#
# NOTE ON REVIEW: GitHub Actions cannot be run locally, so this file was NOT
# executed — it is written to be correct on first read. The steps are kept
# deliberately conservative (official installers, pinned versions, explicit
# PATH wiring) rather than clever. Sanity-check on the first real push.
#
# OVERLAP: `.github/workflows/lean_action_ci.yml` already builds + lints via
# `leanprover/lean-action`. This workflow is the hand-rolled, explicit-step
# equivalent requested for the release pass; running both on `main` is
# redundant. Consolidating the two is a user decision (see hygiene-report.md).

name: CI

on:
  # push trigger held pending the workflow-consolidation decision
  # (see docs/writeup/hygiene-report.md): lean_action_ci.yml already
  # builds on push; enabling both double-builds.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede in-flight runs on the same ref (a new push cancels the old build).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lake build + blueprint lint
    runs-on: ubuntu-latest
    # The cached (warm) build is ~30-60 min; 120 leaves headroom for a cold run
    # that has to fetch the mathlib cache. A cold *compile* (no cache) is hours
    # and is deliberately NOT what this gate covers — `lake exe cache get` below
    # is required precisely to avoid it.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install elan (the Lean toolchain manager) via the official installer.
      # `--default-toolchain none` avoids fetching a toolchain we don't want;
      # the exact version is pinned from `lean-toolchain` in the next step.
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Pin the toolchain from lean-toolchain (currently leanprover/lean4:v4.32.0-rc1).
      # Any `lake`/`lean` call inside the repo also honours this file, so the
      # build cannot silently drift onto another toolchain.
      - name: Install pinned Lean toolchain
        run: elan toolchain install "$(cat lean-toolchain)"

      # Warm cache for the build tree across runs. `.lake` holds the project
      # build plus the mathlib dependency; keying on lean-toolchain +
      # lake-manifest.json busts it whenever the toolchain or deps change.
      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lake-v1-${{ runner.os }}-

      # REQUIRED: download precompiled mathlib oleans. A cold mathlib *compile*
      # is hours; this makes it minutes. No-op when the .lake cache already has
      # them.
      - name: Get mathlib cache
        run: lake exe cache get

      # The gate. A nonzero exit from `lake build` fails the job (default step
      # behaviour), which is exactly the pass/fail signal we want: every proof
      # kernel-checks or the run is red.
      - name: Build (kernel-checks every proof)
        run: lake build

      # Second check: docs<->code consistency + repo-wide axiom/sorry audit.
      # Runs after the build so the oleans it elaborates against are on disk.
      #
      # continue-on-error: the script bundles genuine gates (sorry sweep, axiom
      # audit of the headliners) with docs<->code consistency checks whose
      # coverage is only the Brun guide + largesieve + the headliner list
      # (per CLAUDE.md, explicit12 and other tracks are audited MANUALLY). A
      # nonzero exit can therefore reflect known-manual docs drift rather than a
      # build regression, so it must not block the `lake build` gate above. It
      # is currently green on `main`; treat a red lint as a signal to inspect,
      # not an automatic merge block. Flip to a hard gate once the docs parser
      # covers every track.
      - name: Blueprint lint (docs<->code + axiom audit)
        continue-on-error: true
        run: python3 scripts/blueprint_lint.py
