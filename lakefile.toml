name = "salt"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Salt"]

# MEMORY BACKSTOP for the build path (Captain-approved 19:02; compiler seat).
# `saltbuild.sh` caps only its `*.lean` audit branch — `lake build` passed no
# `-M` at all, and every pressure event of 2026-08-06 came from a `lake build`.
#
# `weakLeanArgs`, NOT `moreLeanArgs` as the order named. Both are passed to
# `lean` when compiling a module (Lake source `LeanConfig.lean:161-180`, read
# rather than remembered); they differ in exactly one property, and Lake's own
# docstring is explicit: `weakLeanArgs` "do not affect the trace of the build
# result, so they can be changed without triggering a rebuild."
# A memory cap cannot change a successful build's OUTPUT — it only decides
# whether the build survives — so it is semantically weak by nature. In
# `moreLeanArgs` it would invalidate all 9,718 traces here on every adjustment,
# mid-wave, for a guard that changes no result.
#
# VERIFIED, not assumed (saltworks, 19:0x): at `-M 1000` a forced module compile
# dies with Lean's own ratified diagnostic — `excessive memory consumption
# detected at 'interpreter'` — and at `-M 20000` the full build is green with 13
# of 16 modules REPLAYED, i.e. the cap moved without invalidating the cache.
#
# RE-VERIFIED 2026-08-06 ~21:20 ON THE MAESTRO'S CAP CHASE, and one result
# overturns a rule this fleet ratified. Read from Lake's OWN trace, not inferred:
#   bin/lean -M 20000 .../SaltWorks/HDL/ISA.lean     ->  Built (813ms)
#   bin/lean -M 20000 .../Salt.lean                  ->  Built (25s)
# so the key binds on both repos, observed on modules that were BUILT and not
# Replayed -- a replayed module issues no lean invocation and proves nothing.
#
# AND THE WEAK PROPERTY IS MEASURED RATHER THAN ARGUED: changing the cap with
# no artifact deleted did NOT trigger a rebuild (exit 0, nothing recompiled).
# That is the whole reason this is not `moreLeanArgs`, which would invalidate
# 9,718 traces in salt and 8,606 here on every adjustment to a guard that
# changes no result.
#
# /!\ THE CAP DOES NOT ALWAYS ANNOUNCE ITSELF. In a standalone probe package
# at -M <= 4800 (green at >= 9600, same file), `lake build` dies with
#     Stack overflow detected. Aborting.   /   Lean exited with code 134 (SIGABRT)
# and NEITHER ratified diagnostic string appears. The fleet rule "a cap hit
# counts ONLY on the two `excessive memory consumption` texts" therefore returns
# a FALSE NEGATIVE on a real kill: it reads as "the run did not test the cap"
# when the correct response is to raise the cap. Judge a cap hit by exit 134 and
# that text as well.
weakLeanArgs = ["-M", "20000"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0-rc1"

[[lean_lib]]
name = "Salt"
